<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Match Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .stream-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-color: #000;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="stream-container">
        <h1>Live Stream</h1>
        <video id="video" controls autoplay playsinline muted></video>
    </div>

    <script>
        // Your live stream URL
        const streamUrl = "http://180.94.28.28:8097/Fifa-2026/index.fmp4.m3u8?token=98432116951be6ea3920335200f43cbca6f86b50-a1b6cd6f35e6aaa2dc380844b5636927-1781443221-1781439621";
        const video = document.getElementById('video');

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
        // Native support check (primarily for Safari on Mac/iOS)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        } else {
            alert("Your browser does not support HLS streaming.");
        }
    </script>

</body>
</html>
