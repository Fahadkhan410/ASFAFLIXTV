<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium IPTV Web Player - 100% Stream Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-sidebar: #161920;
            --bg-card: #202430;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --green-active: #22c55e;
            --blue-active: #0076df;
            --btn-dark: #1e222b;
            --btn-hover: #2d3343;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 360px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #27272a;
        }

        .filter-section {
            padding: 16px;
            border-bottom: 1px solid #27272a;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .playlist-btn {
            background: var(--btn-dark);
            color: var(--text-main);
            border: 1px solid #27272a;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .playlist-btn:hover {
            background: var(--btn-hover);
        }
        .playlist-btn.active {
            background: var(--green-active);
            border-color: var(--green-active);
            color: white;
        }

        .category-pill {
            background: var(--btn-dark);
            color: var(--text-muted);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .category-pill:hover {
            background: var(--btn-hover);
            color: var(--text-main);
        }
        .category-pill.active {
            background: var(--blue-active);
            color: white;
        }

        #channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 6px;
            background: var(--bg-card);
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, border 0.1s;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            border-color: var(--blue-active);
            transform: translateX(4px);
        }
        .channel-item.active {
            background: var(--blue-active);
            border-color: var(--blue-active);
        }

        .channel-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
            margin-right: 12px;
        }

        .channel-name {
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        #player-container {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
        }

        #player-placeholder {
            position: absolute;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
            padding: 20px;
            text-align: center;
        }

        #video-info-bar {
            padding: 20px;
            background: var(--bg-sidebar);
            border-top: 1px solid #27272a;
        }

        #current-channel-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        #current-channel-category {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="filter-section">
            <div class="section-title">Select M3U Playlist File</div>
            <div class="pill-container" id="playlist-container">
                <div style="color: var(--text-muted); font-size: 0.85rem;">Connecting via Proxy Worker...</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="section-title">Filter by Group Category</div>
            <div class="pill-container" id="category-container">
                <button class="category-pill active">ALL</button>
            </div>
        </div>

        <div id="channel-list"></div>
    </div>

    <div id="main-content">
        <div id="player-container">
            <div id="player-placeholder">Select a channel to begin broadcast loop.</div>
            <video id="video" controls></video>
        </div>
        <div id="video-info-bar">
            <div id="current-channel-title">No Channel Selected</div>
            <div id="current-channel-category">Please choose an active stream from the sidebar.</div>
        </div>
    </div>

    <script>
        const M3U_PLAYLIST_URL = "https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u";
        const PROXY_URL = "https://shiny-lake-84e9.asfaiptv410.workers.dev/?url=";

        let parsedChannelsGlobal = []; 
        let activePlaylistTab = "All Playlists";
        let activeCategoryFilter = "ALL";
        let hlsInstance = null;

        const playlistContainer = document.getElementById('playlist-container');
        const categoryContainer = document.getElementById('category-container');
        const channelListContainer = document.getElementById('channel-list');
        const videoElement = document.getElementById('video');
        const placeholder = document.getElementById('player-placeholder');
        const channelTitle = document.getElementById('current-channel-title');
        const channelCategory = document.getElementById('current-channel-category');

        function parseM3U(m3uString) {
            const lines = m3uString.split('\n');
            const channels = [];
            let currentChannel = null;
            const regexAttributes = /([a-zA-Z0-9_-]+)="([^"]*)"/g;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = { name: 'Unknown Stream', category: 'Uncategorized', logo: '', url: '' };
                    let match;
                    while ((match = regexAttributes.exec(line)) !== null) {
                        const key = match[1].toLowerCase();
                        const value = match[2];
                        if (key === 'group-title') currentChannel.category = value;
                        else if (key === 'tvg-logo') currentChannel.logo = value;
                    }
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) currentChannel.name = line.substring(commaIndex + 1).trim();
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            return channels;
        }

        function formatTabDisplay(categoryName) {
            if (categoryName.toLowerCase().includes('tapmad')) return "Live-Tapmad";
            if (categoryName.toLowerCase().includes('free')) return "Free-Live TV";
            if (categoryName.toLowerCase().includes('vod')) return "Movies-VOD";
            return categoryName;
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Read initial text configuration safely via proxy
            fetch(PROXY_URL + encodeURIComponent(M3U_PLAYLIST_URL))
                .then(res => {
                    if(!res.ok) throw new Error("Connection failed");
                    return res.text();
                })
                .then(data => {
                    parsedChannelsGlobal = parseM3U(data);
                    if(parsedChannelsGlobal.length === 0) {
                        placeholder.textContent = "Empty playlist tracks.";
                        return;
                    }
                    placeholder.textContent = "Select a channel to begin live playback feed.";
                    generateDynamicPlaylistTabs();
                    renderCategoryPills();
                    applyFilters();
                })
                .catch(err => {
                    playlistContainer.innerHTML = '<div style="color:#ef4444;font-size:0.85rem;">Error connection.</div>';
                    placeholder.textContent = "Could not sync playlist structural configurations.";
                });
        });

        function generateDynamicPlaylistTabs() {
            playlistContainer.innerHTML = '';
            const uniqueCategoriesInFile = [...new Set(parsedChannelsGlobal.map(c => c.category))];
            const tabOptions = ["All Playlists"];
            
            uniqueCategoriesInFile.forEach(cat => {
                if(cat && cat !== 'Uncategorized') tabOptions.push(cat);
            });

            tabOptions.forEach(tabRawValue => {
                const btn = document.createElement('button');
                btn.className = `playlist-btn ${activePlaylistTab === tabRawValue ? 'active' : ''}`;
                btn.textContent = formatTabDisplay(tabRawValue);
                
                btn.onclick = () => {
                    document.querySelectorAll('.playlist-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activePlaylistTab = tabRawValue;
                    activeCategoryFilter = "ALL";
                    renderCategoryPills();
                    applyFilters();
                };
                playlistContainer.appendChild(btn);
            });
        }

        function renderCategoryPills() {
            categoryContainer.innerHTML = '';
            let targetChannels = activePlaylistTab === "All Playlists" 
                ? parsedChannelsGlobal 
                : parsedChannelsGlobal.filter(c => c.category === activePlaylistTab);

            const subCategories = [...new Set(targetChannels.map(c => c.category))].sort();

            const allPill = document.createElement('button');
            allPill.className = `category-pill ${activeCategoryFilter === 'ALL' ? 'active' : ''}`;
            allPill.textContent = "ALL";
            allPill.onclick = () => {
                document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                allPill.classList.add('active');
                activeCategoryFilter = "ALL";
                applyFilters();
            };
            categoryContainer.appendChild(allPill);

            subCategories.forEach(catName => {
                const pill = document.createElement('button');
                pill.className = `category-pill ${activeCategoryFilter === catName ? 'active' : ''}`;
                const playIconPrefix = catName.toLowerCase().includes('vod') ? '► ' : '';
                pill.textContent = `${playIconPrefix}${catName.toUpperCase()}`;
                
                pill.onclick = () => {
                    document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeCategoryFilter = catName;
                    applyFilters();
                };
                categoryContainer.appendChild(pill);
            });
        }

        function applyFilters() {
            channelListContainer.innerHTML = '';
            let channelsToDisplay = parsedChannelsGlobal;

            if (activePlaylistTab !== "All Playlists") {
                channelsToDisplay = channelsToDisplay.filter(c => c.category === activePlaylistTab);
            }
            if (activeCategoryFilter !== "ALL") {
                channelsToDisplay = channelsToDisplay.filter(c => c.category === activeCategoryFilter);
            }

            channelsToDisplay.forEach(channel => {
                const row = document.createElement('div');
                row.className = 'channel-item';
                const fallbackLogo = 'https://via.placeholder.com/36/000000/FFFFFF?text=TV';

                row.innerHTML = `
                    <img class="channel-logo" src="${channel.logo || fallbackLogo}" onerror="this.src='${fallbackLogo}'" alt="">
                    <span class="channel-name">${channel.name}</span>
                `;

                row.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    row.classList.add('active');
                    playStream(channel);
                };
                channelListContainer.appendChild(row);
            });
        }

        function playStream(channel) {
            placeholder.style.display = 'none';
            channelTitle.textContent = channel.name;
            channelCategory.textContent = channel.category;

            if (hlsInstance) hlsInstance.destroy();

            // FIXED: Direct playback bypasses the proxy to allow pristine streaming
            const directStreamUrl = channel.url; 

            if (Hls.isSupported() && directStreamUrl.includes('.m3u8')) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(directStreamUrl);
                hlsInstance.attachMedia(videoElement);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play().catch(() => {});
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        placeholder.style.display = 'block';
                        placeholder.textContent = "Stream playback failed. The URL format might require a local app context or token update.";
                    }
                });
            } else {
                videoElement.src = directStreamUrl;
                videoElement.play().catch(() => {
                    placeholder.style.display = 'block';
                    placeholder.textContent = "Format error or video access blocked by provider.";
                });
            }
        }
    </script>
</body>
</html>
