<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Live TV Portal</title>
    
    <!-- Video.js Player Stylesheets and Core Components -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Layout and Design */
        #sidebar { width: 340px; background-color: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #sidebar-header { padding: 20px; background-color: #1e1e1e; border-bottom: 1px solid #333; }
        #search-box { width: 100%; padding: 10px; background: #000; border: 1px solid #444; border-radius: 6px; color: #fff; margin-top: 10px; outline: none; }
        #search-box:focus { border-color: #0078d4; }
        
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #121212; }
        .tab-btn { padding: 12px 5px; border: none; background: #1e1e1e; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; transition: all 0.2s ease; }
        .tab-btn.active { color: #0078d4; border-bottom: 2px solid #0078d4; background: #181818; }

        #channel-list-container { flex: 1; overflow-y: auto; }
        .channel-list { list-style: none; display: none; }
        .channel-list.active { display: block; }
        
        .channel-item { padding: 12px 16px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #222; transition: background 0.2s ease; }
        .channel-item:hover { background: #252525; }
        .channel-item.active { background: #0078d4; }
        
        .channel-logo { width: 36px; height: 36px; border-radius: 4px; margin-right: 15px; background: #000; object-fit: cover; }
        .channel-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Video Workspace Panels */
        #player-container { flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; position: relative; }
        
        /* Enforce Video.js container properties to fill viewport cleanly */
        .video-js { width: 100% !important; height: 100% !important; max-height: 100vh; }
        
        #stream-title { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px; border: 1px solid #444; z-index: 10; font-weight: bold; font-size: 0.9rem; pointer-events: none; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Live Network</h2>
            <input type="text" id="search-box" placeholder="Filter channels..." oninput="filterChannels()">
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tapmad')">Tapmad</button>
            <button class="tab-btn" onclick="switchTab('asfalive')">ASFA</button>
            <button class="tab-btn" onclick="switchTab('bdixtv')">BDIX</button>
            <button class="tab-btn" onclick="switchTab('mixtv')">MIX</button>
        </div>

        <div id="channel-list-container">
            <ul id="tapmad-list" class="channel-list active"></ul>
            <ul id="asfalive-list" class="channel-list"></ul>
            <ul id="bdixtv-list" class="channel-list"></ul>
            <ul id="mixtv-list" class="channel-list"></ul>
        </div>
    </div>

    <div id="player-container">
        <div id="stream-title">Select a channel</div>
        <!-- Set up Video.js base HTML structure -->
        <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline preload="auto"></video>
    </div>

    <!-- VideoJS Engine Imports -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Central Cloudflare Proxy Config
        const PROXY_BASE = 'https://asfaflix.arifmeghla410.workers.dev/?url=';

        const PLAYLISTS = {
            tapmad: 'https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u',
            asfalive: 'https://raw.githubusercontent.com/Fahadkhan410/bdtest/refs/heads/main/cha.m3u',
            bdixtv: 'https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u',
            mixtv: ''
        };

        let player = null;

        // Initialize Player Environment on document load
        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('video-player', {
                fluid: false,
                responsive: true,
                playbackRates: [0.5, 1, 1.5, 2]
            });
            init();
        });

        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === id);
            });
            document.querySelectorAll('.channel-list').forEach(list => {
                list.classList.toggle('active', list.id === `${id}-list`);
            });
            // Clear filtering input when shifting tabs
            document.getElementById('search-box').value = '';
            filterChannels();
        }

        async function init() {
            for (const [key, url] of Object.entries(PLAYLISTS)) {
                if(!url) continue;
                try {
                    // Pull and bypass standard CORS settings on the list text source using your endpoint
                    const res = await fetch(PROXY_BASE + encodeURIComponent(url));
                    const text = await res.text();
                    parseM3U(text, document.getElementById(`${key}-list`));
                } catch(e) { 
                    console.error(`Failed to gather resource arrays for path target: ${key}`, e); 
                }
            }
        }

        function parseM3U(data, container) {
            const lines = data.split('\n');
            let html = '';
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    const name = lines[i].split(',')[1]?.trim() || 'Unknown';
                    const logo = (lines[i].match(/tvg-logo="([^"]+)"/) || [])[1] || '';
                    let url = '';
                    
                    for (let j = i + 1; j < lines.length; j++) {
                        if (lines[j].trim().startsWith('http')) { 
                            url = lines[j].trim(); 
                            break; 
                        }
                    }
                    
                    if (url) {
                        html += `
                        <li class="channel-item" onclick="prepareStream('${encodeURIComponent(url)}', '${name.replace(/'/g, "\\'")}', this)">
                            <img class="channel-logo" src="${logo}" onerror="this.src='https://via.placeholder.com/36/000000/FFFFFF?text=TV'">
                            <span class="channel-name">${name}</span>
                        </li>`;
                    }
                }
            }
            container.innerHTML = html;
        }

        function prepareStream(encodedUrl, name, element) {
            const rawUrl = decodeURIComponent(encodedUrl);
            const proxiedUrl = PROXY_BASE + encodeURIComponent(rawUrl);

            // Interface Updates
            document.getElementById('stream-title').innerText = name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Set content stream type configurations for Video.js pipeline engine
            let streamType = 'application/x-mpegURL'; // Fallback / default option for HLS (.m3u8)
            
            if (rawUrl.toLowerCase().includes('.mp4')) {
                streamType = 'video/mp4';
            } else if (rawUrl.toLowerCase().includes('.mpd')) {
                streamType = 'application/dash+xml';
            }

            // Route safe content addresses directly into VideoJS Player runtime engine
            if (player) {
                player.src({
                    src: proxiedUrl,
                    type: streamType
                });
                player.ready(() => {
                    player.play().catch(error => {
                        console.log("Autoplay blocked or stream connection failed:", error);
                    });
                });
            }
        }

        function filterChannels() {
            const query = document.getElementById('search-box').value.toLowerCase();
            // Restrict updates exclusively inside active display panels to preserve performance scaling
            const activeList = document.querySelector('.channel-list.active');
            if (!activeList) return;

            activeList.querySelectorAll('.channel-item').forEach(el => {
                const nameText = el.querySelector('.channel-name').innerText.toLowerCase();
                el.style.display = nameText.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
