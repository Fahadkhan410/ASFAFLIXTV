<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Live TV Portal</title>
    <!-- Video.js Styles -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar { width: 340px; background-color: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #sidebar-header { padding: 20px; background-color: #1e1e1e; border-bottom: 1px solid #333; }
        #search-box { width: 100%; padding: 10px; background: #000; border: 1px solid #444; border-radius: 6px; color: #fff; margin-top: 10px; }
        
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #121212; }
        .tab-btn { padding: 12px 5px; border: none; background: #1e1e1e; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.8rem; text-transform: uppercase; }
        .tab-btn.active { color: #0078d4; border-bottom: 2px solid #0078d4; background: #181818; }

        #channel-list-container { flex: 1; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Group / Category Accordion Styling */
        .channel-group { border-bottom: 1px solid #222; }
        .group-header { 
            background: #202020; padding: 10px 16px; font-size: 0.85rem; font-weight: bold; 
            color: #aaa; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            user-select: none;
        }
        .group-header:hover { background: #282828; color: #fff; }
        .group-header::after { content: '▼'; font-size: 0.7rem; transition: transform 0.2s; }
        .channel-group.collapsed .group-header::after { transform: rotate(-90deg); }
        
        .channel-list { list-style: none; display: block; }
        .channel-group.collapsed .channel-list { display: none; }
        
        /* Channel Item Styling */
        .channel-item { padding: 12px 16px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #1a1a1a; background: #181818; }
        .channel-item:hover { background: #252525; }
        .channel-item.active { background: #0078d4; }
        
        .channel-logo { width: 36px; height: 36px; border-radius: 4px; margin-right: 15px; background: #000; object-fit: cover; }
        .channel-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Player Container Customizations */
        #player-container { flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; position: relative; }
        #stream-title { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; border: 1px solid #444; z-index: 10; pointer-events: none; }
        
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Live Network</h2>
            <input type="text" id="search-box" placeholder="Filter channels..." oninput="filterChannels()">
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tapmad')">Tapmad</button>
            <button class="tab-btn" onclick="switchTab('asfalive')">ASFA</button>
            <button class="tab-btn" onclick="switchTab('bdixtv')">BDIX</button>
            <button class="tab-btn" onclick="switchTab('mixtv')">MIX</button>
        </div>

        <div id="channel-list-container">
            <div id="tapmad-container" class="tab-content active"></div>
            <div id="asfalive-container" class="tab-content"></div>
            <div id="bdixtv-container" class="tab-content"></div>
            <div id="mixtv-container" class="tab-content"></div>
        </div>
    </div>

    <div id="player-container">
        <div id="stream-title">Select a channel</div>
        <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay preload="auto" playsinline></video>
    </div>

    <!-- Video.js Ecosystem Library Scripts -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-dash/5.1.1/videojs-contrib-dash.min.js"></script>

    <script>
        const PLAYLISTS = {
            tapmad: 'https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u',
            asfalive: 'https://raw.githubusercontent.com/Fahadkhan410/bdtest/refs/heads/main/cha.m3u',
            bdixtv: 'https://asfaflix.arifmeghla410.workers.dev',
            mixtv: ''
        };

        let player = null;

        document.addEventListener("DOMContentLoaded", () => {
            player = videojs('video-player', {
                fluid: false,
                responsive: true,
                liveui: true
            });
            init();
        });

        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase() === id));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.toggle('active', content.id === `${id}-container`));
            filterChannels();
        }

        async function init() {
            for (const [key, url] of Object.entries(PLAYLISTS)) {
                if(!url) continue;
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    parseM3U(text, document.getElementById(`${key}-container`));
                } catch(e) { console.error(`Error loading ${key}`); }
            }
        }

        function parseM3U(data, container) {
            const lines = data.split('\n');
            const groups = {};

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    const line = lines[i];
                    const name = line.split(',')[1]?.trim() || 'Unknown Channel';
                    const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '';
                    
                    // Extract group-title attribute, fall back to 'Uncategorized' if missing
                    const groupName = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Uncategorized';
                    
                    let url = '';
                    for (let j = i + 1; j < lines.length; j++) {
                        if (lines[j].startsWith('http')) { url = lines[j].trim(); break; }
                    }
                    
                    if (url) {
                        if (!groups[groupName]) groups[groupName] = [];
                        groups[groupName].push({ name, logo, url });
                    }
                }
            }

            // Build structural group components inside container
            let containerHtml = '';
            for (const [groupName, channels] of Object.entries(groups)) {
                let channelListHtml = '';
                channels.forEach(ch => {
                    channelListHtml += `
                    <li class="channel-item" onclick="play('${ch.url}', '${ch.name}', this)">
                        <img class="channel-logo" src="${ch.logo}" onerror="this.style.display='none'">
                        <span class="channel-name">${ch.name}</span>
                    </li>`;
                });

                containerHtml += `
                <div class="channel-group">
                    <div class="group-header" onclick="toggleGroup(this)">${groupName} (${channels.length})</div>
                    <ul class="channel-list">${channelListHtml}</ul>
                </div>`;
            }
            container.innerHTML = containerHtml;
        }

        function toggleGroup(headerElement) {
            headerElement.parentElement.classList.toggle('collapsed');
        }

        function play(url, name, element) {
            document.getElementById('stream-title').innerText = name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            let type = 'video/mp4';
            if (url.includes('.m3u8')) {
                type = 'application/x-mpegURL';
            } else if (url.includes('.mpd')) {
                type = 'application/dash+xml';
            } else if (url.includes('.webm')) {
                type = 'video/webm';
            }

            if (player) {
                player.src({ src: url, type: type });
                player.ready(() => {
                    player.play().catch(e => console.log("Playback error: ", e));
                });
            }
        }

        function filterChannels() {
            const q = document.getElementById('search-box').value.toLowerCase();
            
            document.querySelectorAll('.tab-content').forEach(tab => {
                const isTabActive = tab.classList.contains('active');
                const groups = tab.querySelectorAll('.channel-group');
                
                groups.forEach(group => {
                    const items = group.querySelectorAll('.channel-item');
                    let visibleChannelsInGroup = 0;

                    items.forEach(el => {
                        const matchesSearch = el.innerText.toLowerCase().includes(q);
                        
                        if (q === '') {
                            // Empty query context: reset visibility based strictly on current tab configuration
                            el.style.display = 'flex';
                            visibleChannelsInGroup++;
                        } else {
                            // Search filtering query execution
                            if (matchesSearch) {
                                el.style.display = 'flex';
                                visibleChannelsInGroup++;
                            } else {
                                el.style.display = 'none';
                            }
                        }
                    });

                    // Manage individual components based on conditions
                    if (q === '') {
                        // Restore structural views when resetting filters
                        group.style.display = isTabActive ? 'block' : 'none';
                        group.classList.remove('collapsed'); // Optional: keeps groups open or you can default to closed
                    } else {
                        // During active filters, hide groups entirely if they contain zero matches
                        if (visibleChannelsInGroup > 0) {
                            group.style.display = 'block';
                            group.classList.remove('collapsed'); // Auto-expand matching groups during query filtering
                        } else {
                            group.style.display = 'none';
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
