<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Live TV Portal</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar { width: 340px; background-color: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #sidebar-header { padding: 20px; background-color: #1e1e1e; border-bottom: 1px solid #333; }
        #search-box { width: 100%; padding: 10px; background: #000; border: 1px solid #444; border-radius: 6px; color: #fff; margin-top: 10px; }
        
        /* Group Dropdown Styling */
        #group-container { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
        #group-container label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        #group-select { width: 100%; padding: 8px 10px; background: #252525; border: 1px solid #444; border-radius: 4px; color: #fff; outline: none; cursor: pointer; }
        
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #121212; margin-top: 10px; }
        .tab-btn { padding: 12px 5px; border: none; background: #1e1e1e; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.8rem; text-transform: capitalize; }
        .tab-btn.active { color: #0078d4; border-bottom: 2px solid #0078d4; background: #181818; }

        #channel-list-container { flex: 1; overflow-y: auto; }
        .channel-list { list-style: none; display: none; }
        .channel-list.active { display: block; }
        
        .channel-item { padding: 12px 16px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #222; }
        .channel-item:hover { background: #252525; }
        .channel-item.active { background: #0078d4; }
        
        .channel-logo { width: 36px; height: 36px; border-radius: 4px; margin-right: 15px; background: #000; object-fit: cover; }
        .channel-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Player Container Customizations */
        #player-container { flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; position: relative; }
        #stream-title { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; border: 1px solid #444; z-index: 10; pointer-events: none; }
        
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Live Network</h2>
            <input type="text" id="search-box" placeholder="Filter channels..." oninput="filterChannels()">
            
            <div id="group-container">
                <label for="group-select">Category / Group</label>
                <select id="group-select" onchange="handleGroupChange()">
                    <option value="all">All Categories</option>
                </select>
            </div>
        </div>
        
        <div class="tabs">
            <button id="tab-btn-tapmad" class="tab-btn active" onclick="switchTab('tapmad')">Tapmad</button>
            <button id="tab-btn-asfalive" class="tab-btn" onclick="switchTab('asfalive')">ASFA</button>
            <button id="tab-btn-bdixtv" class="tab-btn" onclick="switchTab('bdixtv')">BDIX</button>
            <button id="tab-btn-mixtv" class="tab-btn" onclick="switchTab('mixtv')">MIX</button>
        </div>

        <div id="channel-list-container">
            <ul id="tapmad-list" class="channel-list active"></ul>
            <ul id="asfalive-list" class="channel-list"></ul>
            <ul id="bdixtv-list" class="channel-list"></ul>
            <ul id="mixtv-list" class="channel-list"></ul>
        </div>
    </div>

    <div id="player-container">
        <div id="stream-title">Select a channel</div>
        <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay preload="auto" playsinline></video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-dash/5.1.1/videojs-contrib-dash.min.js"></script>

    <script>
        const PLAYLISTS = {
            tapmad: 'https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u',
            asfalive: 'https://raw.githubusercontent.com/Fahadkhan410/bdtest/refs/heads/main/cha.m3u',
            bdixtv: 'https://asfaflix.arifmeghla410.workers.dev',
            mixtv: ''
        };

        let player = null;
        let currentTabId = 'tapmad'; 
        let MasterGroupSet = new Set(); // Stores all distinct groups globally across all m3u lines

        document.addEventListener("DOMContentLoaded", () => {
            player = videojs('video-player', {
                fluid: false,
                responsive: true,
                liveui: true
            });
            init();
        });

        function switchTab(id) {
            currentTabId = id;
            
            // Toggle button states cleanly
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.id === `tab-btn-${id}`);
            });
            
            // Toggle content container panels
            document.querySelectorAll('.channel-list').forEach(list => {
                list.classList.toggle('active', list.id === `${id}-list`);
            });
            
            filterChannels();
        }

        async function init() {
            for (const [key, url] of Object.entries(PLAYLISTS)) {
                if(!url) continue;
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    parseM3U(text, document.getElementById(`${key}-list`));
                } catch(e) { console.error(`Error loading ${key}:`, e); }
            }
            // Populate our drop-down globally once data is compiled
            updateGlobalGroupDropdown();
        }

        function parseM3U(data, container) {
            const lines = data.split('\n');
            let html = '';
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    const name = lines[i].split(',')[1]?.trim() || 'Unknown';
                    const logo = (lines[i].match(/tvg-logo="([^"]+)"/) || [])[1] || '';
                    const group = (lines[i].match(/group-title="([^"]+)"/) || [])[1] || 'Uncategorized';
                    
                    MasterGroupSet.add(group); // Save category metadata context globally

                    let url = '';
                    for (let j = i + 1; j < lines.length; j++) {
                        if (lines[j].trim().startsWith('http')) { 
                            url = lines[j].trim(); 
                            break; 
                        }
                    }
                    if (url) {
                        html += `
                        <li class="channel-item" data-group="${group.replace(/"/g, '&quot;')}" onclick="play('${url}', '${name.replace(/'/g, "\\'")}', this)">
                            <img class="channel-logo" src="${logo}" onerror="this.style.display='none'">
                            <span class="channel-name">${name}</span>
                        </li>`;
                    }
                }
            }
            container.innerHTML = html;
        }

        // Generates an immutable master group matrix list for user select operations
        function updateGlobalGroupDropdown() {
            const selectEl = document.getElementById('group-select');
            selectEl.innerHTML = '<option value="all">All Categories</option>';
            
            const sortedGroups = Array.from(MasterGroupSet).sort();
            sortedGroups.forEach(groupName => {
                const opt = document.createElement('option');
                opt.value = groupName;
                opt.textContent = groupName;
                selectEl.appendChild(opt);
            });
        }

        // AUTO-SWITCH TAB LOGIC HERE
        function handleGroupChange() {
            const chosenGroup = document.getElementById('group-select').value;
            
            if (chosenGroup !== 'all') {
                // Look for the first list tab containing a channel belonging to this group option selection
                for (const key of Object.keys(PLAYLISTS)) {
                    const listEl = document.getElementById(`${key}-list`);
                    if (listEl && listEl.querySelector(`[data-group="${chosenGroup}"]`)) {
                        // Match Found: Switch our view layer directly to that list's tab layout
                        switchTab(key);
                        return; // Exit process frame once tab destination has targeted accurately
                    }
                }
            }
            // Execute layout refresh constraints naturally
            filterChannels();
        }

        function play(url, name, element) {
            document.getElementById('stream-title').innerText = name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            let type = 'video/mp4';
            const cleanUrl = url.split('?')[0].toLowerCase();
            if (cleanUrl.includes('.m3u8')) {
                type = 'application/x-mpegURL';
            } else if (cleanUrl.includes('.mpd')) {
                type = 'application/dash+xml';
            } else if (cleanUrl.includes('.webm')) {
                type = 'video/webm';
            } else if (cleanUrl.includes('.ogg') || cleanUrl.includes('.ogv')) {
                type = 'video/ogg';
            }

            if (player) {
                player.src({ src: url, type: type });
                player.ready(() => {
                    player.play().catch(error => {
                        console.log("Stream delivery interrupted: ", error);
                    });
                });
            }
        }

        function filterChannels() {
            const searchInput = document.getElementById('search-box').value.toLowerCase();
            const chosenGroup = document.getElementById('group-select').value;
            
            document.querySelectorAll('.channel-list').forEach(list => {
                const isTabActive = list.id === `${currentTabId}-list`;
                const items = list.querySelectorAll('.channel-item');
                
                items.forEach(el => {
                    const elGroup = el.getAttribute('data-group');
                    const matchesSearch = el.querySelector('.channel-name').innerText.toLowerCase().includes(searchInput);
                    const matchesGroup = (chosenGroup === 'all' || elGroup === chosenGroup);
                    
                    // Filter down items inside the targeted viewport frame interface environment context directly
                    if (isTabActive && matchesSearch && matchesGroup) {
                        el.style.display = 'flex';
                    } else {
                        el.style.display = 'none';
                    }
                });
            });
        }
    </script>
</body>
</html>
