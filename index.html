<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Live TV Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar { width: 340px; background-color: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #sidebar-header { padding: 20px; background-color: #1e1e1e; border-bottom: 1px solid #333; }
        #search-box { width: 100%; padding: 10px; background: #000; border: 1px solid #444; border-radius: 6px; color: #fff; margin-top: 10px; }
        
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #121212; }
        .tab-btn { padding: 12px 5px; border: none; background: #1e1e1e; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.8rem; }
        .tab-btn.active { color: #0078d4; border-bottom: 2px solid #0078d4; background: #181818; }

        #channel-list-container { flex: 1; overflow-y: auto; }
        .channel-list { list-style: none; display: none; }
        .channel-list.active { display: block; }
        
        .channel-item { padding: 12px 16px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #222; }
        .channel-item:hover { background: #252525; }
        .channel-item.active { background: #0078d4; }
        
        .channel-logo { width: 36px; height: 36px; border-radius: 4px; margin-right: 15px; background: #000; object-fit: cover; }
        .channel-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #player-container { flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; max-width: 100%; max-height: 100vh; object-fit: contain; }
        #stream-title { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; border: 1px solid #444; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Live Network</h2>
            <input type="text" id="search-box" placeholder="Filter channels..." oninput="filterChannels()">
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tapmad')">Tapmad</button>
            <button class="tab-btn" onclick="switchTab('asfalive')">ASFA</button>
            <button class="tab-btn" onclick="switchTab('bdixtv')">BDIX</button>
            <button class="tab-btn" onclick="switchTab('mixtv')">MIX</button>
        </div>

        <div id="channel-list-container">
            <ul id="tapmad-list" class="channel-list active"></ul>
            <ul id="asfalive-list" class="channel-list"></ul>
            <ul id="bdixtv-list" class="channel-list"></ul>
            <ul id="mixtv-list" class="channel-list"></ul>
        </div>
    </div>

    <div id="player-container">
        <div id="stream-title">Select a channel</div>
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        const PLAYLISTS = {
            tapmad: 'https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u',
            asfalive: 'https://raw.githubusercontent.com/Fahadkhan410/bdtest/refs/heads/main/cha.m3u',
            bdixtv: 'https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u',
            mixtv: '' // You can insert a mixed HLS/DASH .m3u link here
        };

        let hlsPlayer = null;
        let dashPlayer = null;

        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${id}'`));
            });
            document.querySelectorAll('.channel-list').forEach(list => {
                list.classList.toggle('active', list.id === `${id}-list`);
            });
        }

        async function init() {
            for (const [key, url] of Object.entries(PLAYLISTS)) {
                if(!url) continue;
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    parseM3U(text, document.getElementById(`${key}-list`));
                } catch(e) { console.error(`Error loading ${key}:`, e); }
            }
        }

        function parseM3U(data, container) {
            const lines = data.split('\n').map(line => line.trim());
            let html = '';
            
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    const name = lines[i].split(',')[1]?.trim() || 'Unknown Channel';
                    const logo = (lines[i].match(/tvg-logo="([^"]+)"/) || [])[1] || '';
                    let url = '';
                    
                    for (let j = i + 1; j < lines.length; j++) {
                        if (lines[j].startsWith('#EXTINF:')) break; 
                        if (lines[j].startsWith('http')) { 
                            url = lines[j]; 
                            break; 
                        }
                    }
                    
                    if (url) {
                        const safeUrl = encodeURI(url);
                        const safeName = name.replace(/'/g, "\\'");
                        
                        html += `
                        <li class="channel-item" onclick="play('${safeUrl}', '${safeName}', this)">
                            <img class="channel-logo" src="${logo}" onerror="this.style.display='none'">
                            <span class="channel-name">${name}</span>
                        </li>`;
                    }
                }
            }
            container.innerHTML = html;
        }

        function resetPlayers() {
            const video = document.getElementById('video');
            
            if (hlsPlayer) { 
                hlsPlayer.destroy(); 
                hlsPlayer = null; 
            }
            if (dashPlayer) {
                dashPlayer.reset();
                dashPlayer = null;
            }
            
            video.removeAttribute('src');
            video.load();
        }

        function play(url, name, element) {
            document.getElementById('stream-title').innerText = name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const video = document.getElementById('video');
            resetPlayers(); // Strip previous instances and sources

            const lowerUrl = url.toLowerCase();

            // 1. MPEG-DASH Pipeline (.mpd)
            if (lowerUrl.includes('.mpd')) {
                dashPlayer = dashjs.MediaPlayer().create();
                dashPlayer.initialize(video, url, true);
                dashPlayer.on(dashjs.MediaPlayer.events.CAN_PLAY, () => {
                    video.play().catch(e => console.log("Autoplay context interception triggered."));
                });
            } 
            // 2. HLS Pipeline (.m3u8)
            else if (lowerUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls({ maxMaxBufferLength: 10 });
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(video);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.log("Autoplay context interception triggered."));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play().catch(e => console.log("Autoplay context interception triggered."));
                }
            } 
            // 3. Fallback Native Video Formats (MP4, MKV, WebM, etc.)
            else {
                video.src = url;
                video.play().catch(e => console.log("Autoplay context interception triggered."));
            }
        }

        function filterChannels() {
            const q = document.getElementById('search-box').value.toLowerCase();
            document.querySelectorAll('.channel-item').forEach(el => {
                const text = el.querySelector('.channel-name').innerText.toLowerCase();
                el.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }

        init();
    </script>
</body>
</html>
