<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Live TV Portal Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar { width: 340px; background-color: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        #sidebar-header { padding: 20px; background-color: #1e1e1e; border-bottom: 1px solid #333; }
        #search-box { width: 100%; padding: 10px; background: #000; border: 1px solid #444; border-radius: 6px; color: #fff; margin-top: 10px; }
        
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #121212; }
        .tab-btn { padding: 12px 5px; border: none; background: #1e1e1e; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.8rem; text-align: center; }
        .tab-btn.active { color: #0078d4; border-bottom: 2px solid #0078d4; background: #181818; }

        #channel-list-container { flex: 1; overflow-y: auto; }
        .channel-list { list-style: none; display: none; }
        .channel-list.active { display: block; }
        
        .channel-item { padding: 12px 16px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #222; }
        .channel-item:hover { background: #252525; }
        .channel-item.active { background: #0078d4; }
        
        .channel-logo { width: 36px; height: 36px; border-radius: 4px; margin-right: 15px; background: #000; object-fit: cover; }
        .channel-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Player Container */
        #player-container { flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; max-width: 100%; max-height: 100vh; object-fit: contain; }
        #stream-title { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px; border: 1px solid #444; z-index: 10; pointer-events: none; font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2>Live Network</h2>
            <input type="text" id="search-box" placeholder="Filter channels..." oninput="filterChannels()">
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tapmad')">Tapmad</button>
            <button class="tab-btn" onclick="switchTab('asfalive')">ASFA</button>
            <button class="tab-btn" onclick="switchTab('bdixtv')">BDIX</button>
            <button class="tab-btn" onclick="switchTab('mixtv')">MIX</button>
        </div>

        <div id="channel-list-container">
            <ul id="tapmad-list" class="channel-list active"></ul>
            <ul id="asfalive-list" class="channel-list"></ul>
            <ul id="bdixtv-list" class="channel-list"></ul>
            <ul id="mixtv-list" class="channel-list"></ul>
        </div>
    </div>

    <div id="player-container">
        <div id="stream-title">Select a channel</div>
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        const PLAYLISTS = {
            tapmad: 'https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u',
            asfalive: 'https://raw.githubusercontent.com/Fahadkhan410/bdtest/refs/heads/main/cha.m3u',
            bdixtv: 'https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u',
            mixtv: '' // Add custom playlist here if needed
        };

        let hlsEngine = null;
        let dashEngine = null;

        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const clickAttr = btn.getAttribute('onclick') || '';
                btn.classList.toggle('active', clickAttr.includes(`'${id}'`));
            });
            document.querySelectorAll('.channel-list').forEach(list => {
                list.classList.toggle('active', list.id === `${id}-list`);
            });
        }

        async function init() {
            for (const [key, url] of Object.entries(PLAYLISTS)) {
                if(!url) continue;
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    parseM3U(text, document.getElementById(`${key}-list`));
                } catch(e) { console.error(`Error loading ${key} playlist:`, e); }
            }
        }

        function parseM3U(data, container) {
            if (!container) return;
            const lines = data.split('\n').map(line => line.trim());
            let html = '';
            
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF:')) {
                    const name = lines[i].split(',')[1]?.trim() || 'Unknown Channel';
                    const logo = (lines[i].match(/tvg-logo="([^"]+)"/) || [])[1] || '';
                    let url = '';
                    
                    for (let j = i + 1; j < lines.length; j++) {
                        if (lines[j].startsWith('#EXTINF:')) break; 
                        if (lines[j].startsWith('http')) { 
                            url = lines[j]; 
                            break; 
                        }
                    }
                    
                    if (url) {
                        // Protect parameters and tokens inside the onclick handler
                        const safeUrl = encodeURI(url);
                        const safeName = name.replace(/'/g, "\\'");
                        
                        html += `
                        <li class="channel-item" onclick="playStream('${safeUrl}', '${safeName}', this)">
                            <img class="channel-logo" src="${logo}" onerror="this.style.display='none'">
                            <span class="channel-name">${name}</span>
                        </li>`;
                    }
                }
            }
            container.innerHTML = html;
        }

        function destroyEngines() {
            if (hlsEngine) {
                hlsEngine.destroy();
                hlsEngine = null;
            }
            if (dashEngine) {
                dashEngine.reset();
                dashEngine = null;
            }
        }

        function playStream(url, name, element) {
            // UI updates
            document.getElementById('stream-title').innerText = name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            const video = document.getElementById('video');
            destroyEngines();
            
            // Clean URL parameters for format detection, but preserve token for actual playback
            const cleanUrl = url.split('?')[0].toLowerCase();

            // 1. DASH Playback (.mpd)
            if (cleanUrl.includes('.mpd')) {
                dashEngine = dashjs.MediaPlayer().create();
                dashEngine.initialize(video, url, true);
                dashEngine.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                    console.error("DASH Engine Error:", e);
                });
            } 
            // 2. HLS Playback (.m3u8, including fragmented fmp4.m3u8 or tokenized urls)
            else if (cleanUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsEngine = new Hls({
                        maxMaxBufferLength: 15,
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hlsEngine.loadSource(url);
                    hlsEngine.attachMedia(video);
                    hlsEngine.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(err => console.log("Autoplay context blocked. Interaction required."));
                    });
                    hlsEngine.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log('Fatal network error encountered, trying to recover...');
                                    hlsEngine.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log('Fatal media error encountered, trying to recover...');
                                    hlsEngine.recoverMediaError();
                                    break;
                                default:
                                    destroyEngines();
                                    break;
                            }
                        }
                    });
                } 
                // Native HLS fallback (Safari / iOS devices)
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play().catch(err => console.log("Playback interaction deferred."));
                }
            } 
            // 3. Fallback for Native Formats (Direct MP4, MKV, WebM, etc.)
            else {
                video.src = url;
                video.play().catch(err => console.log("Direct video playback paused."));
            }
        }

        function filterChannels() {
            const q = document.getElementById('search-box').value.toLowerCase();
            document.querySelectorAll('.channel-item').forEach(el => {
                const text = el.querySelector('.channel-name').innerText.toLowerCase();
                el.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }

        // Initialize lists on load
        init();
    </script>
</body>
</html>
