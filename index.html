<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium IPTV Player - Stable Live Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-sidebar: #161920;
            --bg-card: #202430;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --green-active: #22c55e;
            --blue-active: #0076df;
            --btn-dark: #1e222b;
            --btn-hover: #2d3343;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 360px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid #27272a; }
        .filter-section { padding: 16px; border-bottom: 1px solid #27272a; }
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; font-weight: 700; }
        .pill-container { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .playlist-btn { background: var(--btn-dark); color: var(--text-main); border: 1px solid #27272a; padding: 8px 14px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .playlist-btn.active { background: var(--green-active); border-color: var(--green-active); color: white; }
        
        .category-pill { background: var(--btn-dark); color: var(--text-muted); border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .category-pill.active { background: var(--blue-active); color: white; }

        #channel-list { flex: 1; overflow-y: auto; padding: 12px; }
        .channel-item { display: flex; align-items: center; padding: 10px; margin-bottom: 6px; background: var(--bg-card); border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .channel-item:hover { border-color: var(--blue-active); }
        .channel-item.active { background: var(--blue-active); border-color: var(--blue-active); }
        .channel-logo { width: 36px; height: 36px; object-fit: contain; background: #000; border-radius: 4px; margin-right: 12px; }
        .channel-name { font-weight: 500; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        #player-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; }
        #player-placeholder { position: absolute; color: var(--text-muted); font-size: 1.1rem; text-align: center; pointer-events: none; z-index: 10; }
        #video-info-bar { padding: 20px; background: var(--bg-sidebar); border-top: 1px solid #27272a; }
        #current-channel-title { font-size: 1.3rem; font-weight: 700; }
        #current-channel-category { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="filter-section">
            <div class="section-title">M3U Playlists</div>
            <div class="pill-container" id="playlist-container"></div>
        </div>
        <div class="filter-section">
            <div class="section-title">Categories</div>
            <div class="pill-container" id="category-container"></div>
        </div>
        <div id="channel-list">
            <div style="padding: 10px; color: var(--text-muted);">Syncing IPTV Nodes...</div>
        </div>
    </div>

    <div id="main-content">
        <div id="player-container">
            <div id="player-placeholder">Select a channel to play</div>
            <video id="video" controls autoplay></video>
        </div>
        <div id="video-info-bar">
            <div id="current-channel-title">No Stream Running</div>
            <div id="current-channel-category">Select a live dynamic feed from the sidebar.</div>
        </div>
    </div>

    <script>
        const PROXY_URL = "https://shiny-lake-84e9.asfaiptv410.workers.dev/?url=";

        const PLAYLISTS_CONFIG = [
            { id: "bd-tv", name: "All Playlists", url: "https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u" },
            { id: "live-tapmad", name: "Live-Tapmad", url: "https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u" },
            { id: "free-live", name: "Free-Live TV", url: "https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u" },
            { id: "movies-vod", name: "Movies-VOD", url: "https://raw.githubusercontent.com/abusaeeidx/BDxTV/refs/heads/main/channels_pl2.m3u" }
        ];

        let rawChannelsList = []; 
        let activeCategoryFilter = "ALL";
        let activePlaylistConfig = PLAYLISTS_CONFIG[0];
        let hlsInstance = null;

        const playlistContainer = document.getElementById('playlist-container');
        const categoryContainer = document.getElementById('category-container');
        const channelListContainer = document.getElementById('channel-list');
        const videoElement = document.getElementById('video');
        const placeholder = document.getElementById('player-placeholder');
        const channelTitle = document.getElementById('current-channel-title');
        const channelCategory = document.getElementById('current-channel-category');

        function parseM3U(m3uString) {
            const lines = m3uString.split('\n');
            const channels = [];
            let currentChannel = null;
            const regexAttributes = /([a-zA-Z0-9_-]+)="([^"]*)"/g;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = { name: 'Unknown Stream', category: 'Uncategorized', logo: '', url: '' };
                    let match;
                    while ((match = regexAttributes.exec(line)) !== null) {
                        const key = match[1].toLowerCase();
                        const value = match[2];
                        if (key === 'group-title') currentChannel.category = value;
                        else if (key === 'tvg-logo') currentChannel.logo = value;
                    }
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) currentChannel.name = line.substring(commaIndex + 1).trim();
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            return channels;
        }

        function generatePlaylistButtons() {
            playlistContainer.innerHTML = '';
            PLAYLISTS_CONFIG.forEach((playlist) => {
                const btn = document.createElement('button');
                btn.className = `playlist-btn ${activePlaylistConfig.id === playlist.id ? 'active' : ''}`;
                btn.textContent = playlist.name;
                btn.onclick = () => {
                    activeCategoryFilter = "ALL"; 
                    activePlaylistConfig = playlist;
                    fetchAndLoadPlaylist(playlist.url);
                };
                playlistContainer.appendChild(btn);
            });
        }

        function fetchAndLoadPlaylist(url) {
            channelListContainer.innerHTML = '<div style="color:var(--text-muted);padding:10px;">Loading links from GitHub...</div>';
            generatePlaylistButtons();
            
            fetch(PROXY_URL + encodeURIComponent(url))
                .then(res => res.text())
                .then(data => {
                    let parsed = parseM3U(data);
                    if (activePlaylistConfig.id === "live-tapmad") {
                        rawChannelsList = parsed.filter(c => c.category.toLowerCase().includes('tapmad'));
                    } else if (activePlaylistConfig.id === "free-live") {
                        rawChannelsList = parsed.filter(c => c.category.toLowerCase().includes('free'));
                    } else if (activePlaylistConfig.id === "movies-vod") {
                        rawChannelsList = parsed.filter(c => c.category.toLowerCase().includes('vod'));
                    } else {
                        rawChannelsList = parsed;
                    }
                    renderCategoryPills();
                    applyFilters();
                })
                .catch(() => {
                    channelListContainer.innerHTML = '<div style="color:#ef4444;padding:10px;">Failed to parse playlist file.</div>';
                });
        }

        function renderCategoryPills() {
            const categories = [...new Set(rawChannelsList.map(c => c.category))].sort();
            categoryContainer.innerHTML = `<button class="category-pill ${activeCategoryFilter === 'ALL' ? 'active' : ''}" id="cat-pill-all">ALL</button>`;
            document.getElementById('cat-pill-all').onclick = (e) => selectCategory('ALL', e.target);

            categories.forEach(catName => {
                const pill = document.createElement('button');
                pill.className = `category-pill ${activeCategoryFilter === catName ? 'active' : ''}`;
                pill.textContent = catName.toUpperCase();
                pill.onclick = (e) => selectCategory(catName, e.target);
                categoryContainer.appendChild(pill);
            });
        }

        function selectCategory(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            channelListContainer.innerHTML = '';
            const filtered = activeCategoryFilter === "ALL" ? rawChannelsList : rawChannelsList.filter(c => c.category === activeCategoryFilter);

            filtered.forEach(channel => {
                const row = document.createElement('div');
                row.className = 'channel-item';
                row.innerHTML = `
                    <img class="channel-logo" src="${channel.logo || 'https://via.placeholder.com/36/000?text=TV'}" onerror="this.src='https://via.placeholder.com/36/000?text=TV'">
                    <span class="channel-name">${channel.name}</span>
                `;
                row.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    row.classList.add('active');
                    playStream(channel);
                };
                channelListContainer.appendChild(row);
            });
        }

        // চূড়ান্ত ফিক্সড প্লেয়ার ইঞ্জিন যা fMP4 সেগমেন্ট এবং কোয়েরি প্যারামিটার টোকেন লস্ট হতে দেয় না
        function playStream(channel) {
            placeholder.style.display = 'none';
            channelTitle.textContent = channel.name;
            channelCategory.textContent = channel.category;

            if (hlsInstance) hlsInstance.destroy();

            // মাস্টার লিংকটিকে প্রক্সি দিয়ে এনকোড করা হলো
            const masterManifestUrl = PROXY_URL + encodeURIComponent(channel.url);

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxMaxBufferLength: 10,
                    // এই মেথডটি রিলেটিভ ইউআরএল তৈরির সময় অরিজিনাল টোকেন প্যারামিটার রিটেইন করতে ব্রাউজারকে বাধ্য করে
                    resolveSourceUrl: function(url, bUrl) {
                        // যদি অলরেডি প্রক্সি ইউআরএল হয়ে থাকে তবে রিটার্ন করবে
                        if (url.startsWith(PROXY_URL)) return url;
                        
                        // যদি পরম ইউআরএল (Absolute URL) হয় তবে প্রক্সি র‍্যাপ করবে
                        if (url.startsWith('http://') || url.startsWith('https://')) {
                            return PROXY_URL + encodeURIComponent(url);
                        }
                        
                        // রিলেটিভ পাথ (.fmp4 / .ts চাঙ্ক) হ্যান্ডেল করা
                        try {
                            // প্লেলিস্টের মূল বেস ইউআরএল থেকে সম্পূর্ণ পাথ জেনারেট করা হচ্ছে
                            const baseUriNode = bUrl.startsWith(PROXY_URL) ? decodeURIComponent(bUrl.split('?url=')[1]) : bUrl;
                            const absoluteUrl = new URL(url, baseUriNode).href;
                            return PROXY_URL + encodeURIComponent(absoluteUrl);
                        } catch (e) {
                            return url;
                        }
                    },
                    xhrSetup: function(xhr, url) {
                        if (!url.startsWith(PROXY_URL)) {
                            const rewriteUrl = PROXY_URL + encodeURIComponent(url);
                            xhr.open('GET', rewriteUrl, true);
                        }
                    }
                });
                
                hlsInstance.loadSource(masterManifestUrl);
                hlsInstance.attachMedia(videoElement);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play().catch(() => {});
                });
                
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error("HLS Intercept Logs:", data);
                        placeholder.style.display = 'block';
                        placeholder.textContent = "Error: Stream network drop or handshake refused.";
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari Native
                videoElement.src = masterManifestUrl;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchAndLoadPlaylist(PLAYLISTS_CONFIG[0].url);
        });
    </script>
</body>
</html>
